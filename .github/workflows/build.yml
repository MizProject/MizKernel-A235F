name: Build MizKernel

on:
  push:
    branches:
      - main
    tags:
      - "*"
      - "!ci-*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Target defconfig under arch/<arch>/configs/ (auto-discovered if empty)"
        required: false
        type: string
        default: ""
      lto:
        description: "Clang LTO mode"
        required: false
        type: choice
        default: "keep"
        options:
          - keep
          - none
          - thin
          - full
      lld:
        description: "Linker selection"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - on
          - off
      localversion:
        description: "Override LOCALVERSION (empty uses defconfig)"
        required: false
        type: string
        default: ""
      clean_cache:
        description: "Skip restoring cached toolchains"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish GitHub Release (auto skips on PR or missing TOKEN_KEYS)"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - "true"
          - "false"
      prerelease:
        description: "Mark release as prerelease (auto marks branch/dispatch & pre-tags)"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - "true"
          - "false"
      release_tag:
        description: "Optional custom GitHub Release tag (auto-generated if empty)"
        required: false
        type: string
        default: ""
      ak3_include_dtb:
        description: "Stage compiled *.dtb into AnyKernel3 zip (when present)"
        required: false
        type: boolean
        default: false
      ak3_include_dtbo:
        description: "Stage packed dtbo.img into AnyKernel3 zip (when present)"
        required: false
        type: boolean
        default: false
      ak3_include_modules:
        description: "Stage compiled .ko modules into AnyKernel3 zip (when present)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: "Resolve Metadata"
    runs-on: ubuntu-26.04
    outputs:
      arch: ${{ steps.resolve.outputs.arch }}
      defconfig: ${{ steps.resolve.outputs.defconfig }}
      kernel_version: ${{ steps.resolve.outputs.kernel_version }}
      localversion: ${{ steps.resolve.outputs.localversion }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      dynamic_version: ${{ steps.resolve.outputs.dynamic_version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      has_token_keys: ${{ steps.resolve.outputs.has_token_keys }}
      env_keys_present: ${{ steps.resolve.outputs.env_keys_present }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve metadata & verify env keys
        id: resolve
        env:
          TOKEN_KEYS: ${{ secrets.TOKEN_KEYS }}
          INPUT_DEFCONFIG: ${{ inputs.defconfig }}
          INPUT_LOCALVERSION: ${{ inputs.localversion }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release || 'auto' }}
          INPUT_PRERELEASE: ${{ inputs.prerelease || 'auto' }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=(
            metadata
            --check-env-key TOKEN_KEYS
            --publish-release "$INPUT_PUBLISH_RELEASE"
            --prerelease "$INPUT_PRERELEASE"
            --github-output "$GITHUB_OUTPUT"
            --step-summary "$GITHUB_STEP_SUMMARY"
          )
          if [ -n "$INPUT_DEFCONFIG" ]; then
            args+=(--defconfig "$INPUT_DEFCONFIG")
          fi
          if [ -n "$INPUT_LOCALVERSION" ]; then
            args+=(--localversion "$INPUT_LOCALVERSION")
          fi
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            args+=(--release-tag "$INPUT_RELEASE_TAG")
          fi
          python3 miz_build.py "${args[@]}"

  build:
    name: "Kernel Build (Ubuntu 26.04)"
    needs: [meta]
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Ubuntu 26.04 kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            binutils \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            gawk \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            make \
            openssl \
            perl \
            pkg-config \
            python3 \
            rsync \
            tar \
            xz-utils \
            zip \
            zlib1g-dev \
            zstd

      - name: Cache toolchains
        if: ${{ inputs.clean_cache != true }}
        uses: actions/cache@v6
        with:
          path: toolchain
          key: ${{ runner.os }}-toolchains-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-toolchains-

      - name: Fetch toolchains
        run: python3 miz_build.py fetch-toolchains

      - name: Verify build environment
        run: python3 miz_build.py check

      - name: Build & package kernel
        env:
          INPUT_DEFCONFIG: ${{ inputs.defconfig }}
          INPUT_LTO: ${{ inputs.lto || 'keep' }}
          INPUT_LLD: ${{ inputs.lld || 'auto' }}
          INPUT_LOCALVERSION: ${{ inputs.localversion }}
        run: |
          args=(
            build
            --clean
            --dist-dir "${{ runner.temp }}/dist"
            --release-dir "${{ runner.temp }}/release"
            --lto "$INPUT_LTO"
            --lld "$INPUT_LLD"
          )
          if [ -n "$INPUT_DEFCONFIG" ]; then
            args+=(--defconfig "$INPUT_DEFCONFIG")
          fi
          if [ -n "$INPUT_LOCALVERSION" ]; then
            args+=(--localversion "$INPUT_LOCALVERSION")
          fi
          python3 miz_build.py "${args[@]}"

      - name: Resolve optional AnyKernel3 payloads
        id: ak3_opts
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_DTB: ${{ inputs.ak3_include_dtb }}
          IN_DTBO: ${{ inputs.ak3_include_dtbo }}
          IN_MODULES: ${{ inputs.ak3_include_modules }}
          VAR_DTB: ${{ vars.AK3_INCLUDE_DTB }}
          VAR_DTBO: ${{ vars.AK3_INCLUDE_DTBO }}
          VAR_MODULES: ${{ vars.AK3_INCLUDE_MODULES }}
          DIST_DIR: ${{ runner.temp }}/dist
          OUT_BOOT: out/arch/${{ needs.meta.outputs.arch }}/boot
        run: |
          pick_flag() {
            local disp="$1" var="$2"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              [ "$disp" = "true" ] && echo "true" || echo "false"
            else
              [ "$var" = "true" ] && echo "true" || echo "false"
            fi
          }

          INC_DTB=$(pick_flag "$IN_DTB" "$VAR_DTB")
          INC_DTBO=$(pick_flag "$IN_DTBO" "$VAR_DTBO")
          INC_MODULES=$(pick_flag "$IN_MODULES" "$VAR_MODULES")

          kernel_image=""
          for img in Image.gz-dtb Image.lz4-dtb Image.gz Image zImage; do
            if [ -f "$OUT_BOOT/$img" ]; then
              kernel_image="$OUT_BOOT/$img"
              break
            elif [ -f "$DIST_DIR/$img" ]; then
              kernel_image="$DIST_DIR/$img"
              break
            fi
          done
          if [ -z "$kernel_image" ]; then
            echo "::error::No compiled kernel image found in $OUT_BOOT or $DIST_DIR."
            exit 1
          fi

          dtb_path=""
          if [ "$INC_DTB" = "true" ]; then
            if compgen -G "$DIST_DIR/dtbs/*.dtb" >/dev/null; then
              dtb_path="$DIST_DIR/dtbs"
            else
              echo "::notice::ak3_include_dtb enabled, but no compiled *.dtb files were found in $DIST_DIR/dtbs."
            fi
          fi

          dtbo_path=""
          if [ "$INC_DTBO" = "true" ]; then
            for cand in "$OUT_BOOT/dtbo.img" "$OUT_BOOT/dtbo" "$DIST_DIR/dtbo.img" "$DIST_DIR/dtbo"; do
              if [ -f "$cand" ]; then
                dtbo_path="$cand"
                break
              fi
            done
            if [ -z "$dtbo_path" ]; then
              echo "::warning::ak3_include_dtbo enabled, but no packed dtbo.img was found (raw *.dtbo files require mkdtboimg)."
            fi
          fi

          modules_path=""
          do_modules="0"
          if [ "$INC_MODULES" = "true" ]; then
            if compgen -G "$DIST_DIR/modules/*.ko" >/dev/null; then
              modules_path="$DIST_DIR/modules"
              do_modules="1"
            else
              echo "::notice::ak3_include_modules enabled, but no compiled .ko modules were found in $DIST_DIR/modules."
            fi
          fi

          {
            echo "kernel_image=$kernel_image"
            echo "dtb_path=$dtb_path"
            echo "dtbo_path=$dtbo_path"
            echo "modules_path=$modules_path"
            echo "do_modules=$do_modules"
          } >> "$GITHUB_OUTPUT"

      - name: Package Flashable AnyKernel3 Zip
        id: ak3
        uses: MizProject/AnyKernel3Actions@master
        with:
          config-file: .github/anykernel.json
          kernel-image: ${{ steps.ak3_opts.outputs.kernel_image }}
          # AnyKernel3Actions caps gzip decompression at 16 MiB, while A235F's uncompressed Image
          # is ~41 MiB with Linux version/.rodata at ~20.9 MiB; keep soft verification until bumped.
          verify-kernel: "false"
          require-kernel: "true"
          dtb-path: ${{ steps.ak3_opts.outputs.dtb_path }}
          dtbo-path: ${{ steps.ak3_opts.outputs.dtbo_path }}
          modules-path: ${{ steps.ak3_opts.outputs.modules_path }}
          modules-dest: vendor/lib/modules
          strip-modules: "false"
          do-modules: ${{ steps.ak3_opts.outputs.do_modules }}
          zip-name: "MizKernel-AK3-{device}-{kernel_version}-${{ needs.meta.outputs.short_sha }}.zip"
          output-dir: ${{ runner.temp }}/release
          strict: "true"

      - name: Refresh release SHA-256 checksums
        run: python3 miz_build.py checksums --release-dir "${{ runner.temp }}/release"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload full dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mizkernel-${{ needs.meta.outputs.build_number }}-${{ needs.meta.outputs.short_sha }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record Build Summary
        if: ${{ !cancelled() }}
        run: |
          REL_DIR="${{ runner.temp }}/release"
          if [ -d "$REL_DIR" ] && [ "$(find "$REL_DIR" -maxdepth 1 -type f | wc -l)" -gt 0 ]; then
            {
              echo "### ✅ Kernel Build Succeeded (\`${{ needs.meta.outputs.defconfig }}\`)"
              echo ""
              echo "| File | Size |"
              echo "| :--- | :--- |"
              for f in "$REL_DIR"/*; do
                [ -f "$f" ] && echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Kernel Build Failed or Produced No Release Assets" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: "Report & Publish Release"
    needs: [meta, build]
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.build.result == 'success' && needs.meta.outputs.should_release == 'true' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release_assets

      - name: Validate artifacts & checksums
        run: |
          ls -lh release_assets/
          COUNT=$(find release_assets -maxdepth 1 -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No release assets found to publish."
            exit 1
          fi
          (cd release_assets && sha256sum -c SHA256SUMS.txt)

      - name: Generate Release Report & Notes
        run: |
          python3 miz_build.py report \
            --release-dir release_assets \
            --defconfig "${{ needs.meta.outputs.defconfig }}" \
            --release-tag "${{ needs.meta.outputs.release_tag }}" \
            --prerelease "${{ needs.meta.outputs.prerelease }}" \
            --build-number "${{ needs.meta.outputs.build_number }}" \
            --output release_body.md \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.TOKEN_KEYS }}
          tag_name: ${{ needs.meta.outputs.release_tag }}
          name: ${{ needs.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          body_path: release_body.md
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release_assets/*
